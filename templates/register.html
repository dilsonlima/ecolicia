{% extends "base.html" %}

{% block title %}Cadastro - Ecolicia{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }
    
    .form-input {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
    }
    
    .user-type-selector {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
    }
    
    .user-type-option {
        flex: 1;
        text-align: center;
    }
    
    .user-type-radio {
        display: none;
    }
    
    .user-type-label {
        display: block;
        padding: 1rem;
        border: 2px solid #eee;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .user-type-radio:checked + .user-type-label {
        border-color: #2ecc71;
        background-color: rgba(46, 204, 113, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <h2>Crie sua conta</h2>
    <p class="subtitle">Junte-se à comunidade de reciclagem inteligente</p>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username" class="form-label">Nome de Usuário</label>
            <input type="text" id="username" name="username" class="form-input" required>
        </div>
        
        <div class="form-group">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" name="email" class="form-input" required>
        </div>
        
        <h4>Eu sou um:</h4>
        <div class="user-type-selector">
            <div class="user-type-option">
                <input type="radio" id="consumer" name="user_type" value="consumer" class="user-type-radio" checked>
                <label for="consumer" class="user-type-label">
                    <i class="icon-user"></i>
                    <div>Consumidor</div>
                </label>
            </div>
            
            <div class="user-type-option">
                <input type="radio" id="collector" name="user_type" value="collector" class="user-type-radio">
                <label for="collector" class="user-type-label">
                    <i class="icon-collector"></i>
                    <div>Coletor</div>
                </label>
            </div>
            
            <div class="user-type-option">
                <input type="radio" id="recycler" name="user_type" value="recycler" class="user-type-radio">
                <label for="recycler" class="user-type-label">
                    <i class="icon-recycler"></i>
                    <div>Reciclador</div>
                </label>
            </div>
        </div>
        
        <button type="submit" class="btn-primary">Cadastrar</button>
    </form>
    
    <div class="login-redirect">
        Já tem uma conta? <a href="#">Faça login</a>
    </div>
</div>
{% endblock %}
