<!-- static/images/logo.svg -->
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo circular -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)"/>
  
  <!-- Símbolo de reciclagem estilizado -->
  <path d="M35,35 L65,35 L65,50 L50,50 L60,65 L40,65 L30,50 L50,50 Z" 
        fill="none" 
        stroke="white" 
        stroke-width="3"
        stroke-linejoin="round"/>
  
 <!-- Coração detalhado -->
<path d="M50,36 C57,28 63,28 65,36 C68,45 58,52 50,58 C42,52 32,45 35,36 C37,28 43,28 50,36 Z" 
      fill="#ff3860" 
      stroke="#fff" 
      stroke-width="1.2"/>
      
  <!-- Texto (opcional para versões maiores) -->
</svg>